[project]
name = "artem-panel-agent"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "tzdata>=2024.1,<2027",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=14,<16"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
