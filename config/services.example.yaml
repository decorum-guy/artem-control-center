version: 1

# Legacy service-level example. New integrations should prefer config/projects.yaml.
# Every enabled service is automatically materialized in the UI through the
# Widget Resolver. No manual frontend service list is allowed.

ui_materialization:
  enabled: true
  services_catalog: always
  generic_widget_fallback: core.generic-service
  new_items_area: true
  require_visible_instance_for_onboarding_success: true

services:
  - id: artem-control-center-agent
    name: Artem Control Center Agent
    category: system
    environment: local
    source: local
    checks:
      live:
        type: http
        url: http://127.0.0.1:8787/health/live
      ready:
        type: http
        url: http://127.0.0.1:8787/health/ready
    actions:
      - restart-panel-agent
    presentation:
      widget: core.generic-service

  - id: home-assistant-primary
    name: Home Assistant
    category: home
    environment: production
    source: remote
    checks:
      public:
        type: http
        url_env: HA_PUBLIC_URL
      authenticated:
        type: home_assistant
        base_url_env: HA_BASE_URL
        token_env: HA_MONITORING_TOKEN
    actions:
      - create-ha-backup
      - recheck-home-assistant
    constraints:
      may_run_on_panel_laptop: false
      future_host: dedicated_compact_server
    presentation:
      widget: home.authority-status

  - id: coffee-machine
    name: Кофемашина
    category: home
    environment: production
    authority: home-assistant
    priority: p0
    discovery_source: /Users/aartemida/Documents/Homeassistant
    checks:
      state:
        type: home_assistant_coffee
        base_url_env: HA_BASE_URL
        token_env: HA_MONITORING_TOKEN
        entity_env: HA_COFFEE_ENTITY_ID
        last_turned_on_entity_env: HA_COFFEE_LAST_TURNED_ON_ENTITY_ID
        warmup_started_entity_env: HA_COFFEE_WARMUP_STARTED_ENTITY_ID
        warmup_duration_entity_env: HA_COFFEE_WARMUP_DURATION_ENTITY_ID
        note: Exact entity/helper mapping must be discovered from the read-only HA folder and documented before real integration.
    actions:
      - home.coffee.turn_on
      - home.coffee.turn_off
    presentation:
      widget: home.coffee-machine
      pin_to_overview: true
      priority: 100

  - id: kettle
    name: Чайник
    category: home
    environment: production
    authority: home-assistant
    priority: p1
    discovery_source: /Users/aartemida/Documents/Homeassistant
    checks:
      state:
        type: home_assistant_device
        base_url_env: HA_BASE_URL
        token_env: HA_MONITORING_TOKEN
        entity_env: HA_KETTLE_ENTITY_ID
    actions:
      - home.kettle.turn_on
      - home.kettle.turn_off
    presentation:
      widget: core.generic-home-device

  - id: alice-tg-bot
    name: AliceTG Bot
    category: home
    environment: production
    repository: decorum-guy/AliceTG_Bot
    note: Separate HA-stack service; not the authoritative coffee or kettle state source.
    checks:
      live:
        type: http
        url_env: ALICE_TG_BOT_LIVE_URL
      ready:
        type: http
        url_env: ALICE_TG_BOT_READY_URL
    actions:
      - restart-alice-tg-bot
    presentation:
      widget: core.generic-service

  - id: avalar-site-main
    name: AVALAR Website
    category: avalar
    environment: production
    repository: decorum-guy/AVALAR
    checks:
      homepage:
        type: http
        url: https://avalar.pro/
      health:
        type: http
        url: https://avalar.pro/healthz
    actions: []
    presentation:
      widget: core.generic-service

  - id: avalar-site-stage
    name: AVALAR Website Stage
    category: avalar
    environment: stage
    repository: decorum-guy/AVALAR
    checks:
      homepage:
        type: http
        url: https://stage.avalar.pro/
      health:
        type: http
        url: https://stage.avalar.pro/healthz
    actions:
      - avalar.deploy.stage
      - avalar.smoke.stage
    presentation:
      widget: core.generic-service

  - id: avalar-exchange-mcp
    name: AVALAR Exchange MCP
    category: avalar
    environment: production
    repository: decorum-guy/avalar_exchange_mcp
    checks:
      public_health:
        type: http
        url: https://exchange.avalar.pro/health
      readiness:
        type: http
        url_env: AVALAR_EXCHANGE_READY_URL
        auth_env: AVALAR_EXCHANGE_MONITORING_TOKEN
    actions:
      - restart-avalar-exchange-app
      - recheck-avalar-exchange-chain
      - backup-avalar-exchange
    presentation:
      widget: core.generic-service

  - id: proxy-server
    name: Proxy Server
    category: infrastructure
    environment: production
    repository: null
    note: No repository exists; source and configuration are server-managed.
    checks:
      socks:
        type: tcp
        host_env: PROXY_HOST
        port: 1080
      telegram_proxy:
        type: tcp
        host_env: PROXY_HOST
        port: 8080
    actions: []
    presentation:
      widget: core.generic-service

validation:
  require_ui_materialization: true
  require_generic_fallback: true
  allow_zero_actions: true
