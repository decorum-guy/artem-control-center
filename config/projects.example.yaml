version: 1

# Every capability is optional. Every enabled service is automatically
# materialized in the UI through Widget Resolver. If no specialized widget is
# available, core.generic-service is mandatory.

ui_materialization:
  enabled: true
  services_catalog: always
  new_items_area: true
  generic_widget_fallback: core.generic-service
  require_visible_instance_for_onboarding_success: true
  never_overwrite_existing_layout: true

projects:
  - id: external-api
    name: External API
    enabled: true
    category: external
    environments:
      - id: production
        services:
          - id: api
            capabilities:
              monitor:
                adapter: http
                url_env: EXTERNAL_API_HEALTH_URL
                interval_seconds: 60
                stale_after_seconds: 180
              details: null
              open:
                url_env: EXTERNAL_API_PUBLIC_URL
              actions: []
              backups: []
            presentation:
              widget: core.generic-service

  - id: avalar-site
    name: AVALAR Website
    enabled: true
    category: avalar
    repository: decorum-guy/AVALAR
    environments:
      - id: stage
        services:
          - id: website
            capabilities:
              monitor:
                adapter: web_application
                base_url_env: AVALAR_STAGE_URL
              details:
                adapter: protected_http
                url_env: AVALAR_STAGE_DETAILS_URL
                token_env: AVALAR_STAGE_MONITORING_TOKEN
              open:
                url_env: AVALAR_STAGE_URL
              actions:
                - avalar.deploy.stage
                - avalar.smoke.stage
              backups:
                - avalar-site-stage
            presentation:
              widget: core.generic-service
      - id: main
        services:
          - id: website
            capabilities:
              monitor:
                adapter: web_application
                base_url_env: AVALAR_MAIN_URL
              details:
                adapter: protected_http
                url_env: AVALAR_MAIN_DETAILS_URL
                token_env: AVALAR_MAIN_MONITORING_TOKEN
              open:
                url_env: AVALAR_MAIN_URL
              actions:
                - avalar.smoke.main
              backups:
                - avalar-site-main
            presentation:
              widget: core.generic-service

  - id: proxy-server
    name: Proxy Server
    enabled: true
    category: infrastructure
    repository: null
    source_kind: server_managed
    note: No Git repository currently exists; integrate through a restricted host agent.
    environments:
      - id: production
        services:
          - id: danted
            capabilities:
              monitor:
                adapter: host_agent_service
                handler_ref: proxy_danted_health
              actions:
                - proxy.danted.reload
              backups:
                - proxy-config
            presentation:
              widget: core.generic-service
          - id: telegram-proxy
            capabilities:
              monitor:
                adapter: host_agent_service
                handler_ref: proxy_telegram_health
              actions:
                - proxy.telegram.restart
              backups:
                - proxy-config
            presentation:
              widget: core.generic-service
          - id: allow-list
            capabilities:
              monitor:
                adapter: proxy_allow_list
                handler_ref: proxy_allow_list_status
              actions:
                - proxy.allow_list.add
                - proxy.allow_list.remove
              backups:
                - proxy-config
            presentation:
              widget: core.generic-service

  - id: home-stack
    name: Home Assistant Stack
    enabled: true
    category: home
    repository: null
    source_kind: runtime_stack
    constraints:
      home_assistant_on_panel_laptop: forbidden
      future_local_host: dedicated_compact_server
    environments:
      - id: remote-primary
        services:
          - id: home-assistant
            capabilities:
              monitor:
                adapter: home_assistant
                base_url_env: HA_BASE_URL
                token_env: HA_MONITORING_TOKEN
              actions:
                - home.create_backup
                - home.run_registered_scene
              backups:
                - home-assistant-native
            presentation:
              widget: home.authority-status
          - id: alice-tg-bot
            repository: decorum-guy/AliceTG_Bot
            note: Git repository belongs to the HA Telegram bot, not to Home Assistant itself.
            capabilities:
              monitor:
                adapter: structured_http
                live_url_env: ALICE_TG_BOT_LIVE_URL
                ready_url_env: ALICE_TG_BOT_READY_URL
              actions:
                - home.alice_bot.restart
                - home.coffee.turn_on
                - home.coffee.turn_off
              backups:
                - alice-tg-bot-runtime
            presentation:
              widget: core.generic-service
          - id: coffee-machine
            repository: null
            capabilities:
              monitor:
                adapter: coffee_state_aggregator
                ha_url_env: HA_BASE_URL
                alice_bot_state_url_env: ALICE_TG_BOT_COFFEE_STATE_URL
              actions:
                - home.coffee.turn_on
                - home.coffee.turn_off
            presentation:
              widget: home.coffee-machine
              pin_to_overview: true
              priority: 100

  - id: archived-project
    name: Temporarily Disabled Project
    enabled: false
    category: archive
    environments: []

validation:
  allow_zero_actions: true
  require_registered_actions: true
  require_registered_backups: true
  require_ui_materialization: true
  require_generic_widget_fallback: true
  reject_unknown_capabilities: true
  reject_secrets_in_config: true
