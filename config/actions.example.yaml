version: 1

# Actions are independent capabilities. A project may have no actions at all.
# Frontend sends only action id and schema-valid parameters; arbitrary commands are forbidden.

actions:
  - id: restart-panel-agent
    title: Restart Panel Agent
    risk: medium
    confirmation: hold
    hold_ms: 1400
    cooldown_seconds: 30
    executor:
      type: local_service
      service_env: PANEL_AGENT_SERVICE_NAME
      operation: restart
    verify:
      type: http
      url: http://127.0.0.1:8787/health/ready
      timeout_seconds: 45

  - id: home.coffee.turn_on
    enabled: false
    enablement: separate_production_write_approval_required
    title: Turn on coffee machine
    target: home-stack/remote-primary/coffee-machine
    authority: home-assistant
    risk: medium
    confirmation: confirm
    cooldown_seconds: 10
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    executor:
      type: home_assistant_registered_action
      handler_ref: ha_coffee_turn_on
      service: script.turn_on
      entity_id: script.coffee_turn_on
      note: Stable HA package script; enable only after deployment, scoped live capability validation and separate write approval.
    verify:
      type: home_assistant_entity
      entity_id: switch.kofemashina
      expected: "on"
      timeout_seconds: 30

  - id: home.coffee.turn_off
    enabled: false
    enablement: separate_production_write_approval_required
    title: Turn off coffee machine
    target: home-stack/remote-primary/coffee-machine
    authority: home-assistant
    risk: low
    confirmation: instant
    cooldown_seconds: 3
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    executor:
      type: home_assistant_registered_action
      handler_ref: ha_coffee_turn_off
      service: script.turn_on
      entity_id: script.coffee_turn_off
    verify:
      type: home_assistant_entity
      entity_id: switch.kofemashina
      expected: "off"
      timeout_seconds: 30

  - id: home.kettle.turn_on
    enabled: false
    enablement: separate_production_write_approval_required
    title: Turn on kettle
    target: home-stack/remote-primary/kettle
    authority: home-assistant
    risk: medium
    confirmation: confirm
    cooldown_seconds: 10
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    executor:
      type: home_assistant_registered_action
      handler_ref: ha_kettle_turn_on
      service: script.turn_on
      entity_id: script.kettle_boil
      note: Stable HA package script preserves the discovered water-heater flow.
    verify:
      type: home_assistant_entity
      entity_id: water_heater.chainik
      expected: "on"
      timeout_seconds: 30

  - id: home.kettle.turn_off
    enabled: false
    enablement: separate_production_write_approval_required
    title: Turn off kettle
    target: home-stack/remote-primary/kettle
    authority: home-assistant
    risk: low
    confirmation: instant
    cooldown_seconds: 3
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    executor:
      type: home_assistant_registered_action
      handler_ref: ha_kettle_turn_off
      service: script.turn_on
      entity_id: script.kettle_stop
    verify:
      type: home_assistant_entity
      entity_id: water_heater.chainik
      expected: "off"
      timeout_seconds: 30

  - id: home.create_backup
    title: Create Home Assistant backup
    target: home-stack/remote-primary/home-assistant
    risk: medium
    confirmation: hold
    hold_ms: 1400
    cooldown_seconds: 300
    executor:
      type: backup_profile
      profile_id: home-assistant-native
    verify:
      type: backup_result
      required_destination: laptop-primary
      timeout_seconds: 1800

  - id: home.alice_bot.restart
    title: Restart AliceTG Bot
    target: home-stack/remote-primary/alice-tg-bot
    risk: medium
    confirmation: hold
    hold_ms: 1400
    cooldown_seconds: 90
    executor:
      type: restricted_remote_action
      target_ref: home_runtime_host
      action: restart_alice_tg_bot
    verify:
      type: service_health
      service_id: home-stack/remote-primary/alice-tg-bot
      timeout_seconds: 120

  - id: avalar.stage.deploy
    enabled: false
    enablement: draft_external_contract_not_deployed
    title: Deploy AVALAR stage
    target: avalar-site/stage/website
    risk: high
    confirmation: hold
    hold_ms: 1800
    cooldown_seconds: 180
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    preconditions:
      - stage_host_reachable
      - no_deploy_in_progress
      - deployment_script_checksum_valid
    executor:
      type: local_allowlisted_wrapper
      handler_ref: avalar_stage_deploy
      fixed_procedure: './scripts/control-center-action.sh deploy-stage --execute'
      note: Wrapper delegates to the existing AVALAR update script; remains disabled until its Draft PR is deployed and registered locally.
      allow_arbitrary_command: false
    verify:
      type: check_group
      checks:
        - avalar_stage_deployment_marker
        - avalar_stage_health
        - avalar_stage_browser_smoke
      timeout_seconds: 150
    audit: required

  - id: avalar.stage.smoke
    title: Check AVALAR stage
    target: avalar-site/stage/website
    risk: low
    confirmation: instant
    executor:
      type: local_allowlisted_wrapper
      handler_ref: avalar_stage_smoke
      fixed_procedure: './scripts/control-center-action.sh smoke-stage'
    verify:
      type: command_result
      timeout_seconds: 180

  - id: avalar.main.smoke
    enabled: false
    enablement: draft_external_contract_not_deployed
    title: Check AVALAR main
    target: avalar-site/main/website
    risk: low
    confirmation: instant
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    executor:
      type: local_allowlisted_wrapper
      handler_ref: avalar_main_smoke
      fixed_procedure: './scripts/control-center-action.sh smoke-main'
      allow_arbitrary_command: false
    verify:
      type: command_result
      timeout_seconds: 180

  - id: restart-avalar-exchange-app
    enabled: false
    enablement: external_contract_not_applied
    title: Restart AVALAR Exchange MCP application
    target: avalar-exchange-mcp/production/application
    risk: high
    confirmation: hold
    hold_ms: 1800
    cooldown_seconds: 90
    executor:
      type: restricted_remote_action
      target_ref: avalar_exchange_origin
      action: restart_application
    verify:
      type: check_group
      checks:
        - avalar_exchange_public_health
        - avalar_exchange_oauth_metadata
        - avalar_exchange_ready
      timeout_seconds: 120

  - id: project.backup.create
    title: Create project backup
    risk: medium
    confirmation: hold
    hold_ms: 1400
    cooldown_seconds: 30
    parameters:
      type: object
      additionalProperties: false
      required: [profile_id, sync_mode]
      properties:
        profile_id:
          type: string
          enum_from_config: enabled_backup_profiles
        sync_mode:
          type: string
          enum: [profile_default, local_only, include_optional_destinations]
    executor:
      type: backup_profile
      profile_id_from_parameter: profile_id
    verify:
      type: backup_result

  - id: system.rog_g703.wake
    enabled: false
    enablement: PANEL_ROG_G703_ENABLED_and_Panel_Agent_access_policy
    title: Wake ASUS ROG G703GI
    target: rog_g703gi
    risk: low
    confirmation: instant
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    executor:
      type: fixed_wol
      target_id: rog_g703gi
      note: MAC, broadcast and interface are backend-only configuration.
    verify:
      type: fixed_companion_health
      route: /health
      timeout_seconds: 60

  - id: system.rog_g703.hibernate
    enabled: false
    enablement: PANEL_ROG_G703_ENABLED_and_Panel_Agent_access_policy
    title: Hibernate ASUS ROG G703GI
    target: rog_g703gi
    risk: medium
    confirmation: confirm
    cooldown_seconds: 10
    parameters:
      type: object
      additionalProperties: false
      properties: {}
    executor:
      type: fixed_companion_action
      target_id: rog_g703gi
      route: /hibernate
      operation: windows_s4_hibernate
      allow_arbitrary_command: false
    verify:
      type: fixed_companion_unreachable
      timeout_seconds: 45
