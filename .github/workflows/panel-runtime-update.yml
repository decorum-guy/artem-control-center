name: Panel runtime update UX

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: panel-runtime-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Runtime update browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/panel-agent/requirements-dev.txt

      - name: Bootstrap project
        run: npm run setup

      - name: Install Chromium
        run: npm run install:browsers

      - name: Run runtime update and shutdown browser gate
        env:
          VITE_V2_VISUAL_SHELL: "true"
          VITE_TOUCH_INPUT_LOCK_ENABLED: "true"
          VITE_TOUCH_INPUT_LOCK_START_LOCKED: "false"
        run: npm run test:e2e -- tests/e2e/panel-runtime-update.spec.ts
