name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PANEL_AGENT_MODE: read_only
  PANEL_WRITES_ENABLED: "false"
  PANEL_COFFEE_TIMING_WRITES_ENABLED: "false"
  PANEL_COFFEE_NOTIFICATION_WRITES_ENABLED: "false"
  PANEL_COFFEE_ACTIONS_ENABLED: "false"
  PANEL_KIOSK_CONTROLS_ENABLED: "false"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/panel-agent/requirements-dev.txt

      - name: Bootstrap project
        run: npm run setup

      - name: Validate Windows production scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/windows/test-production-scripts.ps1
          ./scripts/windows/test-update-production-validation-temp.ps1
          ./scripts/windows/test-connectivity-contract.ps1
          ./scripts/windows/test-connectivity-keygen.ps1
          ./scripts/windows/test-avalar-identities-contract.ps1
          ./scripts/windows/test-avalar-identities.ps1
          ./scripts/windows/test-rog-g703-companion.ps1

      - name: Run full validation
        run: npm run check

      - name: Install Chromium for focused B0 browser gate
        if: runner.os == 'Linux'
        run: npm run install:browsers

      - name: Run focused B0 browser gate
        if: runner.os == 'Linux'
        run: npm run test:e2e -- tests/e2e/b0-samsung.spec.ts

      - name: Run focused V2 shell gate
        if: runner.os == 'Linux'
        env:
          VITE_V2_VISUAL_SHELL: "true"
          V2_ARTIFACT_DIR: artifacts/v2-shell-review
          B3_PLANNING_TASKS_ROUTE_ENABLED: "true"
          B3_PLANNING_CALENDAR_ROUTE_ENABLED: "true"
          B3_PLANNING_REMINDERS_ROUTE_ENABLED: "true"
        run: npm run test:e2e -- tests/e2e/v2-shell.spec.ts

      - name: Upload V2 shell review screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: v2-shell-review-${{ github.sha }}
          path: artifacts/v2-shell-review
          if-no-files-found: error

      - name: Run focused V2 overlay gate
        if: runner.os == 'Linux'
        env:
          VITE_V2_VISUAL_SHELL: "true"
          V2_OVERLAY_ARTIFACT_DIR: artifacts/v2-overlays-review
          B3_PLANNING_TASKS_ROUTE_ENABLED: "true"
          B3_PLANNING_CALENDAR_ROUTE_ENABLED: "true"
          B3_PLANNING_REMINDERS_ROUTE_ENABLED: "true"
        run: npm run test:e2e -- tests/e2e/v2-overlays.spec.ts

      - name: Upload V2 overlay review screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: v2-overlays-review-${{ github.sha }}
          path: artifacts/v2-overlays-review
          if-no-files-found: error

      - name: Run focused PR6 Weather compositor and route gate
        if: runner.os == 'Linux'
        env:
          VITE_V2_VISUAL_SHELL: "true"
          V2_WEATHER_ARTIFACT_DIR: artifacts/v2-weather-review
        run: npm run test:e2e -- tests/e2e/v2-weather.spec.ts

      - name: Upload PR6 Weather review screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: v2-weather-review-${{ github.sha }}
          path: artifacts/v2-weather-review
          if-no-files-found: error

      - name: Run focused PR7 route-density gate
        if: runner.os == 'Linux'
        env:
          VITE_V2_VISUAL_SHELL: "true"
          V2_ROUTE_DENSITY_ARTIFACT_DIR: artifacts/v2-route-density-review
        run: npm run test:e2e -- tests/e2e/v2-route-density.spec.ts

      - name: Upload PR7 route-density review screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: v2-route-density-review-${{ github.sha }}
          path: artifacts/v2-route-density-review
          if-no-files-found: error

      - name: Run focused PR8 Settings information architecture gate
        if: runner.os == 'Linux'
        env:
          VITE_V2_VISUAL_SHELL: "true"
          V2_SETTINGS_ARTIFACT_DIR: artifacts/v2-settings-review
        run: npm run test:e2e -- tests/e2e/v2-settings.spec.ts

      - name: Upload PR8 Settings review screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: v2-settings-review-${{ github.sha }}
          path: artifacts/v2-settings-review
          if-no-files-found: error

      - name: Run focused V2 Overview grid gate
        if: runner.os == 'Linux'
        env:
          VITE_OVERVIEW_V2_ENABLED: "true"
          VITE_V2_VISUAL_SHELL: "true"
          V2_OVERVIEW_ARTIFACT_DIR: artifacts/v2-overview-grid-review
        run: npm run test:e2e -- tests/e2e/v2-overview-grid.spec.ts

      - name: Upload V2 Overview grid review screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: v2-overview-grid-review-${{ github.sha }}
          path: artifacts/v2-overview-grid-review
          if-no-files-found: error

      - name: Run focused PR4 curated Overview gate
        if: runner.os == 'Linux'
        env:
          VITE_OVERVIEW_V2_ENABLED: "true"
          VITE_V2_VISUAL_SHELL: "true"
          V2_OVERVIEW_CURATED_ARTIFACT_DIR: artifacts/v2-overview-curated-review
          B3_PLANNING_TASKS_ROUTE_ENABLED: "true"
          B3_PLANNING_CALENDAR_ROUTE_ENABLED: "true"
          B3_PLANNING_REMINDERS_ROUTE_ENABLED: "true"
        run: npm run test:e2e -- tests/e2e/v2-curated-overview.spec.ts

      - name: Upload PR4 curated Overview review screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: v2-overview-curated-review-${{ github.sha }}
          path: artifacts/v2-overview-curated-review
          if-no-files-found: error

      - name: Run focused PR5 Overview editor gate
        if: runner.os == 'Linux'
        env:
          VITE_OVERVIEW_V2_ENABLED: "true"
          VITE_V2_VISUAL_SHELL: "true"
          VITE_OVERVIEW_EDITOR_ENABLED: "true"
          PANEL_OVERVIEW_LAYOUT_WRITES_ENABLED: "true"
          PANEL_OVERVIEW_LAYOUT_PATH: .cache/overview-editor-e2e.json
          V2_OVERVIEW_EDITOR_ARTIFACT_DIR: artifacts/v2-overview-editor-review
        run: npm run test:e2e -- tests/e2e/v2-overview-editor.spec.ts

      - name: Upload PR5 Overview editor review screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: v2-overview-editor-review-${{ github.sha }}
          path: artifacts/v2-overview-editor-review
          if-no-files-found: error

      - name: Run Overview grid gate without V2 visual shell
        if: runner.os == 'Linux'
        env:
          VITE_OVERVIEW_V2_ENABLED: "true"
          VITE_V2_VISUAL_SHELL: "false"
        run: npm run test:e2e -- tests/e2e/v2-overview-grid.spec.ts --grep "does not require the V2 visual shell"

      - name: Run focused B3 browser gate
        if: runner.os == 'Linux'
        env:
          B2_PLANNING_OVERVIEW_ENABLED: "true"
          B3_PLANNING_TASKS_ROUTE_ENABLED: "true"
          B3_PLANNING_CALENDAR_ROUTE_ENABLED: "true"
          B3_PLANNING_REMINDERS_ROUTE_ENABLED: "true"
        run: npm run test:e2e -- tests/e2e/b3-planning-routes.spec.ts

      - name: Smoke-test production runtime
        run: npm run test:production-smoke
