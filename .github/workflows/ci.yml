name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PANEL_AGENT_MODE: read_only
  PANEL_WRITES_ENABLED: "false"
  PANEL_COFFEE_TIMING_WRITES_ENABLED: "false"
  PANEL_COFFEE_NOTIFICATION_WRITES_ENABLED: "false"
  PANEL_COFFEE_ACTIONS_ENABLED: "false"
  PANEL_KIOSK_CONTROLS_ENABLED: "false"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/panel-agent/requirements-dev.txt

      - name: Bootstrap project
        run: npm run setup

      - name: Validate Windows production scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows/test-production-scripts.ps1

      - name: Run full validation
        run: npm run check
