name: Edge kiosk process-tree hotfix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-kiosk-process-tree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-process-tree:
    name: Windows Edge process-tree regression
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deterministic Edge process-tree regression
        shell: powershell
        run: ./scripts/windows/test-kiosk-process-tree.ps1
